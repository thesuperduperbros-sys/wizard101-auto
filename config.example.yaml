# Copy to config.yaml and adjust. Every key is optional; defaults are shown.

# The default setup camps at the wizard's starting position and targets Troubled Warriors.
mode: farm
farm_seconds_between_fights: 2.0
farm_zone: Grizzleheim/GH_Hero # Savarstaad Pass; farm mode stays at its starting position
farm_mob: Troubled Warrior
log_file: wiz101-auto.log

quest:
  teleport: true            # false = walk to objectives (slower, looks more human)
  accept_side_quests: false
  side_quest_world: ""       # focus only on side quests in one world, e.g. Dragonspyre; ignore story quests
  photomancy: true
  stuck_minutes: 12         # stop if the objective doesn't change for this long

upkeep:
  use_potions: true
  potion_health_ratio: 0.5
  potion_mana_ratio: 0.2
  collect_wisps: true
  min_health_to_fight: 0.8  # below this, heal up (potion, wisps, rest) before questing
  rest_until_health: 0.95
  rest_max_minutes: 8       # stop the bot if health can't be recovered in this time
  wisp_health_ratio: 0.8

safety:
  stop_key: ctrl+shift+q     # any ctrl/shift/alt combo + one key, e.g. "ctrl+]"
  pause_key: ctrl+shift+p
  stall_seconds: 15          # nothing happens this long -> close menus, restart step, switch quest...
  max_hours: 0               # 0 = no time limit
  mouseless: true           # clicks via a memory hook; your real mouse stays free

combat:
  max_discards: 2
  flee_below: 0.0           # e.g. 0.15 to flee under 15% health; 0 = never
  strategy:
    heal_threshold: 0.45
    ally_heal_threshold: 0.35
    shield_threshold: 0.6
    max_blades: 2
    max_traps: 2
    kill_bonus: 400.0
    boss_setup: true
    setup_health_multiplier: 2.0
    max_hand_size: 7
    allow_discard: true

progression:
  enabled: false

pet:
  auto: true
  stop_at_goal: false       # use all available pet energy each trip
  feed: true
